# V5 FCOS layout detector — --parallel (A5000 x3 via DDP), on the V5 generalized 350K set.
profile: parallel
seed: 42

manifests:
  train: data/manifests_v5/train.jsonl
  val:   data/manifests_v5/val.jsonl
image_size: 1280

batch_size_per_device: 4
grad_accum_steps: 2
num_workers: 8

epochs: 4
optimizer:
  type: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
scheduler:
  type: cosine
  warmup_steps: 2000
gradient_clip_norm: 5.0
mixed_precision: bf16

score_thresh: 0.3
nms_iou: 0.5
max_det: 300

eval_every_steps: 3000
eval_max_pages: 500
save_every_steps: 3000   # save at every eval so a good checkpoint is never missed
# A5000 box: keep big checkpoints OFF the near-full root drive (/ is 97% full); use /mnt/DATA_1/pheng.
ckpt_dir: /mnt/DATA_1/pheng/kcr/checkpoints/detector_obj_v5_parallel
keep_last_n_ckpts: 5
log_every_steps: 50
