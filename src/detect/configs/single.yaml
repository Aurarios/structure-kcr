# DBNet detector — --single (RTX 4070 Ti 12GB)
profile: single
seed: 42

manifests:
  train: data/manifests/train.jsonl
  val:   data/manifests/val.jsonl
image_size: 960          # square letterbox
shrink_ratio: 0.4

batch_size_per_device: 8
grad_accum_steps: 1
num_workers: 6

epochs: 5
optimizer:
  type: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
scheduler:
  type: cosine
  warmup_steps: 1000
gradient_clip_norm: 5.0

mixed_precision: bf16

# box decode (inference / eval)
prob_thresh: 0.3
box_unclip_ratio: 2.0    # expand detected shrunk region back out (recovers edge glyphs)
edge_margin_frac: 0.18   # extra horizontal margin so first/last char isn't clipped
min_box_size: 4

eval_every_steps: 2000
eval_max_pages: 400
save_every_steps: 5000
ckpt_dir: data/checkpoints/detector_single
keep_last_n_ckpts: 5
log_every_steps: 50
