# Line recognizer — --parallel (3x A5000 24GB, DDP)
# accelerate launch --multi_gpu --num_processes 3 -m src.recognize.train_recognizer --parallel
profile: parallel
seed: 42

tokenizer_model: data/tokenizer/khmer_ocr.model
lines_root: E:/kcr-recognize/lines
manifests:
  train: E:/kcr-recognize/lines/lines_train.jsonl
  val:   E:/kcr-recognize/lines/lines_val.jsonl
max_w: 1200

batch_size_per_device: 256    # x3 = 768
grad_accum_steps: 1
num_workers: 8

epochs: 6
optimizer:
  type: adamw
  lr: 8.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
scheduler:
  type: cosine
  warmup_steps: 2000
label_smoothing: 0.1
ctc_weight: 0.3
gradient_clip_norm: 1.0

mixed_precision: bf16

eval_every_steps: 1000
eval_max_lines: 800
save_every_steps: 2500
ckpt_dir: data/checkpoints/recognizer_parallel
keep_last_n_ckpts: 5
log_every_steps: 25
