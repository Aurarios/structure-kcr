# Line recognizer V3 — --single (RTX 4070 Ti 12GB).
# Trains on line crops harvested from the diverse V3 pages (cards/bilingual/tables/books/worksheets),
# so Khmer + Latin + digits on real-style documents read correctly. V1/V2 recognizer checkpoints are
# left untouched; this writes a separate recognizer_single_v3 checkpoint.
profile: single
seed: 42

tokenizer_model: data/tokenizer/khmer_ocr.model
lines_root: E:/kcr-recognize-v3/lines
manifests:
  train: E:/kcr-recognize-v3/lines/lines_train.jsonl
  val:   E:/kcr-recognize-v3/lines/lines_val.jsonl
max_w: 800

batch_size_per_device: 48
grad_accum_steps: 4
num_workers: 14

epochs: 8
optimizer:
  type: adamw
  lr: 5.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
scheduler:
  type: cosine
  warmup_steps: 2000
label_smoothing: 0.1
ctc_weight: 0.3
gradient_clip_norm: 1.0

mixed_precision: bf16

eval_every_steps: 2000
eval_max_lines: 800
save_every_steps: 5000
ckpt_dir: data/checkpoints/recognizer_single_v3   # separate -> baked V1/V2 recognizers intact
keep_last_n_ckpts: 5
log_every_steps: 50
